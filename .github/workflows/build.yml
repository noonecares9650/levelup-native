name: Build Native APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Fix and Clean Gradle Configs
      run: |
        # Strip any hidden BOM or weird characters and rewrite cleanly
        cat << 'EOF' > settings.gradle
        rootProject.name = "LevelUp"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath "com.android.tools.build:gradle:8.2.2"
                classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22"
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        tasks.register("clean", Delete) {
            delete rootProject.buildDir
        }
        EOF

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Build APK with System Gradle
      run: gradle assembleRelease --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: LevelUp-StudyShield-Release
        path: app/build/outputs/apk/release/*.apk
